name: CI

on:
  push:
    paths: ['spec/manual/find_executable_spec.cr', 'spec/std/process/find_executable_spec.cr']
  pull_request:
    paths: ['spec/manual/find_executable_spec.cr', 'spec/std/process/find_executable_spec.cr']

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    runs-on: ${{ matrix.os }}
    steps:
      - name: Download source
        uses: actions/checkout@v4
      - name: Install Crystal
        uses: oprypin/install-crystal@v1
      - name: Run test
        run: crystal spec/manual/find_executable_spec.cr
